name: Server CI

on:
  push:
    branches:
      - main
      - testing/server-api-tests
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-server:
    name: Test server with PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: personal_finance_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      NODE_ENV: test

      DB_USER: postgres
      DB_HOST: 127.0.0.1
      DB_NAME: personal_finance_tracker_test
      DB_PASSWORD: postgres
      DB_PORT: 5432

      DATABASE_URL: ""

      CLIENT_URL: http://localhost:5173
      SESSION_SECRET: github-actions-test-session-secret

      PGPASSWORD: postgres

    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Create test database schema
        run: >-
          psql
          -h "$DB_HOST"
          -U "$DB_USER"
          -d "$DB_NAME"
          -v ON_ERROR_STOP=1
          -f db/schema.sql

      - name: Run server tests
        run: npm run test:run
